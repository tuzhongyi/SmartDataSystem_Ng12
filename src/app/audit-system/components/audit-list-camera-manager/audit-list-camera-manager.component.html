<div class="audit-list-camera-manager">
  <div class="audit-list-camera-manager-title">
    <div class="hw-second-title">摄像机列表</div>
  </div>
  <div class="audit-list-camera-manager-head">
    <!-- <div class="audit-list-camera-manager-head-operation">
      <button class="hw-blue-btn" (click)="onconfig()">
        <i class="howell-icon-settingoutline"></i> 设置
      </button>
    </div> -->
    <div class="audit-list-camera-manager-head-filter">
      <div class="filter-items">
        <div class="filter-item">
          <div class="filter-item-title">在线状态：</div>
          <div class="filter-item-value">
            <hw-select [(selected)]="args.status.OnlineStatus" [cannull]="true">
              <select hw-select-content [(ngModel)]="args.status.OnlineStatus">
                <option [ngValue]="OnlineStatus.Online">
                  {{ Language.OnlineStatus(OnlineStatus.Online) }}
                </option>
                <option [ngValue]="OnlineStatus.Offline">
                  {{ Language.OnlineStatus(OnlineStatus.Offline) }}
                </option>
              </select>
            </hw-select>
          </div>
        </div>
        <div class="filter-item">
          <div class="filter-item-title">场景变换：</div>
          <div class="filter-item-value">
            <hw-select [(selected)]="args.status.SceneChange" [cannull]="true">
              <select hw-select-content [(ngModel)]="args.status.SceneChange">
                <option [ngValue]="0">
                  {{ Language.SceneChange(0) }}
                </option>
                <option [ngValue]="1">
                  {{ Language.SceneChange(1) }}
                </option>
                <option [ngValue]="2">
                  {{ Language.SceneChange(2) }}
                </option>
              </select>
            </hw-select>
          </div>
        </div>
        <div class="filter-item">
          <div class="filter-item-title">清晰度：</div>
          <div class="filter-item-value">
            <hw-select [(selected)]="args.status.ImageQuality" [cannull]="true">
              <select hw-select-content [(ngModel)]="args.status.ImageQuality">
                <option [ngValue]="0">
                  {{ Language.ImageQuality(0) }}
                </option>
                <option [ngValue]="1">
                  {{ Language.ImageQuality(1) }}
                </option>
                <option [ngValue]="2">
                  {{ Language.ImageQuality(2) }}
                </option>
              </select>
            </hw-select>
          </div>
        </div>
        <div class="filter-item">
          <div class="filter-item-title">视频亮度：</div>
          <div class="filter-item-value">
            <hw-select [(selected)]="args.status.Brightness" [cannull]="true">
              <select hw-select-content [(ngModel)]="args.status.Brightness">
                <option [ngValue]="0">
                  {{ Language.Brightness(0) }}
                </option>
                <option [ngValue]="1">
                  {{ Language.Brightness(1) }}
                </option>
                <option [ngValue]="2">
                  {{ Language.Brightness(2) }}
                </option>
                <option [ngValue]="3">
                  {{ Language.Brightness(3) }}
                </option>
                <option [ngValue]="4">
                  {{ Language.Brightness(4) }}
                </option>
              </select>
            </hw-select>
          </div>
        </div>
        <div class="filter-item">
          <div class="filter-item-title">色差/偏色：</div>
          <div class="filter-item-value">
            <hw-select [(selected)]="args.status.Aberration" [cannull]="true">
              <select hw-select-content [(ngModel)]="args.status.Aberration">
                <option [ngValue]="0">
                  {{ Language.Aberration(0) }}
                </option>
                <option [ngValue]="1">
                  {{ Language.Aberration(1) }}
                </option>
                <option [ngValue]="2">
                  {{ Language.Aberration(2) }}
                </option>
              </select>
            </hw-select>
          </div>
        </div>
        <div class="filter-item">
          <div class="filter-item-title">视频干扰：</div>
          <div class="filter-item-value">
            <hw-select [(selected)]="args.status.Disturbance" [cannull]="true">
              <select hw-select-content [(ngModel)]="args.status.Disturbance">
                <option [ngValue]="0">
                  {{ Language.Disturbance(0) }}
                </option>
                <option [ngValue]="1">
                  {{ Language.Disturbance(1) }}
                </option>
              </select>
            </hw-select>
          </div>
        </div>
        <div class="filter-item">
          <div class="filter-item-title">录像状态：</div>
          <div class="filter-item-value">
            <hw-select [(selected)]="args.status.RecordState" [cannull]="true">
              <select hw-select-content [(ngModel)]="args.status.RecordState">
                <option [ngValue]="0">
                  {{ Language.RecordState(0) }}
                </option>
                <option [ngValue]="1">
                  {{ Language.RecordState(1) }}
                </option>
              </select>
            </hw-select>
          </div>
        </div>
        <div class="filter-item">
          <div class="filter-item-title">行政区：</div>
          <div class="filter-item-value division">
            <common-label-select
              [single]="true"
              [autoclose]="true"
              [(showDropDown)]="controller.division.show"
              [selectedNodes]="
                controller.division.selected
                  ? [controller.division.selected]
                  : []
              "
              [height]="'325px'"
            >
              <howell-division-tree
                #tree
                [defaultIds]="args.divisionId ? [args.divisionId] : []"
                (selectTreeNode)="controller.division.onselect($event)"
              ></howell-division-tree>
            </common-label-select>
          </div>
        </div>
        <div class="filter-item">
          <div class="filter-item-title">类型：</div>
          <div class="filter-item-value">
            <hw-select [(selected)]="args.type" [cannull]="true">
              <select hw-select-content [(ngModel)]="args.type">
                <option [ngValue]="CameraType.G3">
                  {{ CameraType.G3 }}
                </option>
                <option [ngValue]="CameraType.G5">
                  {{ CameraType.G5 }}
                </option>
                <option [ngValue]="CameraType.TD">
                  {{ CameraType.TD }}
                </option>
              </select>
            </hw-select>
          </div>
        </div>
        <div class="filter-item">
          <div class="filter-item-title">分类：</div>
          <div class="filter-item-value">
            <hw-select [(selected)]="args.classification" [cannull]="true">
              <select hw-select-content [(ngModel)]="args.classification">
                <option [ngValue]="CameraClassification.normal">
                  {{
                    Language.CameraClassification(CameraClassification.normal)
                  }}
                </option>
                <option [ngValue]="CameraClassification.thermal">
                  {{
                    Language.CameraClassification(CameraClassification.thermal)
                  }}
                </option>
              </select>
            </hw-select>
          </div>
        </div>

        <div class="filter-item">
          <div class="filter-item-title">名称：</div>
          <div class="filter-item-value">
            <input type="text" [(ngModel)]="args.name" />
          </div>
        </div>
        <div class="filter-item search">
          <button class="hw-blue-btn" (click)="onsearch()">
            <i class="howell-icon-search"></i> 搜索
          </button>
          <button class="hw-blue-btn" (click)="onconfig()">
            <i class="howell-icon-settingoutline"></i> 设置
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="audit-list-camera-manager-body">
    <audit-camera-details-table
      [args]="args"
      [load]="load"
      (video)="onvideo($event)"
      [(config)]="controller.window.config.model"
    ></audit-camera-details-table>
  </div>
</div>
<app-window
  [Model]="controller.window.config"
  *ngIf="controller.window.config.show"
  [style]="controller.window.config.style"
>
  <audit-list-camera-manager-config
    [(config)]="controller.window.config.model"
    (close)="controller.window.config.show = false"
  ></audit-list-camera-manager-config>
</app-window>
<howell-video-player-window
  *ngIf="controller.window.video.show"
  [Model]="controller.window.video"
  [style]="controller.window.video.style"
  [cameraId]="controller.window.video.cameraId"
  [title]="controller.window.video.title"
  [autoplay]="true"
></howell-video-player-window>
