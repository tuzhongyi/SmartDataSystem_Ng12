<div class="audit-list-station-garbage-manager-trashcan-item" *ngIf="!!model">
  <div class="audit-list-station-garbage-manager-trashcan-item-head">
    {{ model.No }}<span *ngIf="model.No">：</span>{{ model.Name }}
  </div>
  <div class="audit-list-station-garbage-manager-trashcan-item-body">
    <div
      #echart
      class="echart"
      *ngIf="model.LidState == 0; else else_lidstate"
    ></div>

    <ng-template #else_lidstate
      ><div class="else_lidstate">垃圾桶盖已关闭</div>
    </ng-template>
  </div>
</div>
