<div class="audit-list-station-garbage-manager-nb-box" *ngIf="!!model">
  <div class="audit-list-station-garbage-manager-nb-box-head">
    <div class="hw-simple-title">{{ model.Name }}NB电源箱</div>
  </div>
  <div class="audit-list-station-garbage-manager-nb-box-body" *ngIf="!!data">
    <audit-list-station-garbage-manager-status-nb-box
      [nb]="data"
    ></audit-list-station-garbage-manager-status-nb-box>
    <audit-list-station-garbage-manager-command-nb-box [model]="model">
    </audit-list-station-garbage-manager-command-nb-box>
  </div>
</div>
