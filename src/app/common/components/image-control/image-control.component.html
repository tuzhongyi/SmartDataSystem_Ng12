<div *ngIf="model" class="image-control" (click)="onClick($event)">
  <div
    *ngIf="
      nosignal &&
      model.status != undefined &&
      model.status != OnlineStatus.Online
    "
    class="error"
  >
    <div>NO SIGNAL</div>
  </div>
  <!-- <img [src]="model.src" (error)="onError($event)" [title]="model.name" /> -->
  <div
    class="img"
    [ngClass]="{
      contain: contain
    }"
    [title]="model.name"
    [ngStyle]="image"
  ></div>
  <canvas
    class="img"
    [ngClass]="{
      contain: contain
    }"
    #canvas
    *ngIf="draw"
  ></canvas>
</div>
