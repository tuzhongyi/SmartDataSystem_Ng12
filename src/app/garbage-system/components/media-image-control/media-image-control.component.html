<div class="video-control" *ngIf="!!model">
  <div class="video-control-head" *ngIf="operation">
    <div class="video-control-head-title">
      <div>
        {{ model.name }}
        <span
          *ngIf="model.ishandle !== undefined && model.istimeout !== undefined"
          [class]="
            Color.class.GarbageDropState(model.ishandle, model.istimeout)
          "
          >{{
            Language.GarbageDropState(model.ishandle, model.istimeout)
          }}</span
        >
      </div>
      <div
        *ngIf="display.capture"
        class="spinner-border green-text"
        [ngClass]="{
          'spinner-border': captureing,
          circle: !captureing
        }"
      ></div>
    </div>
    <div class="video-control-head-operation">
      <div class="label" *ngIf="display.object">目标信息</div>
      <hw-switch
        *ngIf="display.object"
        (onChanged)="ondrawchange($event)"
        [on]="draw"
      ></hw-switch>
      <div
        *ngIf="display.download.video"
        title="下载视频"
        (click)="onvideodownload()"
      >
        <i class="howell-icon-videodownload sky-blue-text"></i>
      </div>
      <div
        *ngIf="display.download.image"
        title="下载图片"
        (click)="onimagedownload()"
      >
        <i class="howell-icon-picturedownload sky-blue-text"></i>
      </div>
      <div title="播放视频" (click)="onplay($event)">
        <i class="howell-icon-video sky-blue-text"></i>
      </div>
    </div>
  </div>
  <div
    class="video-control-body"
    [ngClass]="{
      operation: operation
    }"
  >
    <app-image-control
      [contain]="contain"
      [model]="model"
      [draw]="draw"
    ></app-image-control>
    <div
      class="page"
      [ngStyle]="{ 'justify-content': isfirst ? 'flex-end' : 'space-between' }"
    >
      <div class="prev" *ngIf="!isfirst">
        <div
          class="howell-icon-arrowleftbold blue-text arrow-wrap"
          (click)="onprev()"
        ></div>
      </div>
      <div class="next" *ngIf="!islast">
        <div
          class="howell-icon-arrowrightbold blue-text arrow-wrap"
          (click)="onnext()"
        ></div>
      </div>
    </div>
  </div>
  <div class="video-control-body" *ngIf="img"></div>
</div>
