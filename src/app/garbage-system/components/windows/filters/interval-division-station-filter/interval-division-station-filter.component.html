<div class="event-record-filter">
  <div class="filter-item" [ngClass]="{ hashandle: display_handle }">
    <div class="filter-item-title">开始时间</div>
    <input
      class="filter-item-value"
      type="text"
      DateTimePicker
      [format]="'yyyy年MM月dd日 HH:mm'"
      [startView]="DateTimePickerView.day"
      [minView]="DateTimePickerView.hour"
      [(date)]="duration.begin"
      (dateChange)="changeBegin($event)"
    />
  </div>
  <div class="filter-item" [ngClass]="{ hashandle: display_handle }">
    <div class="filter-item-title">结束时间</div>
    <input
      class="filter-item-value"
      type="text"
      DateTimePicker
      [format]="'yyyy年MM月dd日 HH:mm'"
      [startView]="DateTimePickerView.day"
      [minView]="DateTimePickerView.hour"
      [(date)]="duration.end"
      (dateChange)="changeEnd($event)"
    />
  </div>
  <div class="filter-item select">
    <div class="filter-item-title">行政区</div>
    <!-- <app-select-control
      class="division-select input"
      [data]="model.divisions"
    ></app-select-control> -->
    <!-- <select name="" id="">
      <option [value]="item" *ngFor="let item of model.divisions">
        {{ item.language }}
      </option>
    </select> -->
    <!-- <app-select-control
      class="list-type-select"
      [data]="model.divisions"
      (selectedChange)="ondivision($event)"
    ></app-select-control> -->

    <level-division-panel
      class="filter-item-value list-type-select"
      [selected]="selected.division"
      (selectedChange)="ondivision($event)"
      (loaded)="ondivisionloaded($event)"
    >
    </level-division-panel>
  </div>
  <div class="filter-item" [ngClass]="{ hashandle: display_handle }">
    <div class="filter-item-title">投放点</div>

    <howell-select-station
      class="filter-item-value"
      [divisionId]="divisionId"
      [(stationId)]="stationId"
      (stationIdChange)="onstation()"
    ></howell-select-station>

    <!-- <app-select-control
      class="list-type-select"
      [data]="model.stations"
      (selectedChange)="onstation($event)"
    ></app-select-control> -->
  </div>
  <div class="filter-item" [ngClass]="{ hashandle: display_handle }">
    <div class="filter-item-title">摄像机</div>
    <!-- <hw-select
      class="filter-item-value"
      [(selected)]="filter.camera"
      [cannull]="true"
    >
      <select
        hw-select-content
        class="list-type-select"
        [(ngModel)]="filter.camera"
        (change)="oncamera()"
      >
        <option [ngValue]="item" *ngFor="let item of model.cameras">
          {{ item.Name }}
        </option>
      </select>
    </hw-select> -->

    <howell-select-camera
      class="filter-item-value"
      [divisionId]="this.divisionId"
      [stationId]="this.stationId"
      [(selectedId)]="this.cameraId"
      (selectedIdChange)="oncamera()"
    ></howell-select-camera>
  </div>
  <div class="filter-item hashandle" *ngIf="display_handle">
    <div class="filter-item-title">闭环状态</div>
    <hw-select
      class="filter-item-value"
      [(selected)]="this.handle"
      [cannull]="true"
    >
      <select
        hw-select-content
        class="list-type-select"
        [(ngModel)]="this.handle"
        (change)="onhandle()"
      >
        <option [ngValue]="true">{{ Language.IsHandle(true, type) }}</option>
        <option [ngValue]="false">{{ Language.IsHandle(false, type) }}</option>
      </select>
    </hw-select>
  </div>
</div>
