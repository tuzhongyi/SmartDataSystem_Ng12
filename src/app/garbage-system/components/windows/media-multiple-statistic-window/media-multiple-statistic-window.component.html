<div class="media-multiple-statistic-window" *ngIf="!!model">
  <div class="media-multiple-statistic-window-content">
    <howell-media-multiple-control
      [args]="args"
      [business]="business"
      [fullplay]="fullplay"
    ></howell-media-multiple-control>
  </div>
  <div class="media-multiple-statistic-window-footer" *ngIf="!!model.statistic">
    <div>
      垃圾堆数
      <label class="orange-text">{{ model.statistic.GarbageCount }}</label> 堆
    </div>
    <div *ngIf="!!model.date">{{ model.date | date : "yyyy-MM-dd HH:mm" }}</div>
  </div>
</div>
