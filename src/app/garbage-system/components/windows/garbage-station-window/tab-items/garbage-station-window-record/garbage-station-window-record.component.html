<div class="garbage-station-window-record">
  <div class="garbage-station-window-record-head">
    <ng-content></ng-content>
    <howell-garbage-station-window-record-operation
      (search)="onsearch($event)"
      [(isfilter)]="isfilter"
    >
    </howell-garbage-station-window-record-operation>
  </div>
  <div class="garbage-station-window-record-filter" *ngIf="isfilter">
    <howell-garbage-station-window-record-filter
      [sameDay]="true"
      [(duration)]="filter.duration"
      [(divisionId)]="filter.divisionId"
      [(stationId)]="filter.stationId"
      [(range)]="filter.range"
      [(handle)]="filter.IsHandle"
      [(timeout)]="filter.IsTimeout"
    ></howell-garbage-station-window-record-filter>
  </div>
  <div class="garbage-station-window-record-table" [class.filter]="isfilter">
    <howell-garbage-drop-record-table
      [filter]="filter"
      [load]="load"
      (image)="onimage($event)"
      (video)="onvideo($event)"
      [get]="get"
      (got)="ongot($event)"
      (complete)="oncomplete($event)"
    >
    </howell-garbage-drop-record-table>
    <garbage-drop-record-task-table #task [args]="filter" [load]="load">
    </garbage-drop-record-task-table>
  </div>
</div>
