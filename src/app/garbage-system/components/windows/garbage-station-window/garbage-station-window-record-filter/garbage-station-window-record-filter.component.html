<div class="garbage-station-window-record-filter filter">
  <div class="filter-items">
    <div class="filter-item datetime">
      <div class="filter-item-title">开始时间</div>
      <input
        type="text"
        class="filter-item-value"
        DateTimePicker
        [format]="'yyyy年MM月dd日 HH:mm'"
        [startView]="DateTimePickerView.day"
        [minView]="DateTimePickerView.hour"
        [(date)]="duration.begin"
        (dateChange)="changeBegin($event)"
      />
    </div>
    <div class="filter-item datetime">
      <div class="filter-item-title">结束时间</div>
      <input
        type="text"
        class="filter-item-value"
        DateTimePicker
        [format]="'yyyy年MM月dd日 HH:mm'"
        [startView]="DateTimePickerView.day"
        [minView]="DateTimePickerView.hour"
        [(date)]="duration.end"
        (dateChange)="changeEnd($event)"
      />
    </div>
    <div class="filter-item select">
      <div class="filter-item-title">行政区</div>
      <div class="filter-item-value division">
        <level-division-panel
          [cannull]="true"
          (selectedChange)="ondivision($event)"
        ></level-division-panel>
      </div>
    </div>
    <div class="filter-item">
      <div class="filter-item-title">投放点</div>
      <hw-select
        [(selected)]="stationId"
        [cannull]="true"
        (selectedChange)="onstation()"
      >
        <select
          class="filter-item-value station"
          hw-select-content
          [(ngModel)]="stationId"
        >
          <option [ngValue]="item.Id" *ngFor="let item of model.stations">
            {{ item.Name }}
          </option>
        </select>
      </hw-select>
    </div>
    <div class="filter-item duration">
      <div class="filter-item-title">滞留时长</div>
      <select
        class="filter-item-value"
        [(ngModel)]="range"
        (change)="onrange()"
      >
        <option [ngValue]="item.value" *ngFor="let item of ranges">
          {{ item.Name }}
        </option>
      </select>
    </div>
    <div class="filter-item">
      <div class="filter-item-title">状态</div>
      <select
        class="filter-item-value"
        [(ngModel)]="status"
        (change)="onstatus()"
      >
        <option [ngValue]="undefined">全部任务</option>
        <option [ngValue]="GarbageTaskStatus.unhandled">待处置</option>
        <option [ngValue]="GarbageTaskStatus.handled">已处置</option>
        <option [ngValue]="GarbageTaskStatus.timeout">超时任务</option>
        <option [ngValue]="GarbageTaskStatus.timeout_unhandled">
          超时待处置
        </option>
        <option [ngValue]="GarbageTaskStatus.timeout_handled">超时处置</option>
      </select>
    </div>
  </div>
</div>
