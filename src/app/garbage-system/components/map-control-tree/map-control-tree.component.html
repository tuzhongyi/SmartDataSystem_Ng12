<div class="map-control-tree">
  <mat-tree
    [dataSource]="tree.source"
    [treeControl]="tree.control"
    [trackBy]="tree.trackBy"
    *ngIf="!loading"
  >
    <mat-tree-node
      class="map-control-tree-item"
      *matTreeNodeDef="let node"
      [matTreeNodePadding]="node.level"
      [matTreeNodePaddingIndent]="15"
      [class.selected]="node === selected"
      (click)="onclick(node)"
      (dblclick)="ondblclick(node)"
    >
      <!-- 下拉箭头 -->
      <ng-container *ngIf="tree.control.isExpanded(node) && node.extendable">
        <span><i class="mdi mdi-menu-down"></i></span>
      </ng-container>

      <!-- 下拉箭头 -->
      <ng-container *ngIf="!tree.control.isExpanded(node) && node.extendable">
        <span><i class="mdi mdi-menu-right"></i></span>
      </ng-container>

      <ng-container *ngIf="!node.extendable">
        <span class="unextendable"></span>
      </ng-container>

      <div class="map-control-tree-item-content">
        <div class="map-control-tree-item-content-text">
          <i
            *ngIf="!!node.icon"
            [class]="node.icon"
            [title]="node.icontitle"
          ></i>
          <span [title]="node.text">{{ node.text }}</span>
        </div>
        <div class="map-control-tree-item-content-buttons sky-blue-text2">
          <div
            *ngFor="let button of node.buttons; let index = index"
            (click)="onbuttonclick($event, button)"
            [title]="button.title"
            [class]="button.class"
          >
            <i *ngIf="button.icon" [class]="button.icon"></i>
            <span *ngIf="button.text">{{ button.text }}</span>
          </div>
        </div>
      </div></mat-tree-node
    >
  </mat-tree>
  <div class="loading" *ngIf="loading">
    <mat-spinner></mat-spinner>
  </div>
</div>
