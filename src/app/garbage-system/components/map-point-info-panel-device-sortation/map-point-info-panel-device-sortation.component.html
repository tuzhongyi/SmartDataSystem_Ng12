<div class="panel" *ngIf="data">
  <div class="panel-item">
    <div class="hw-simple-title">
      分拣设备
      <ng-container *ngIf="length > 1">
        <span *ngIf="length > 0">- {{ index + 1 }}</span>
      </ng-container>
    </div>
  </div>
  <div class="panel-item">
    <div class="panel-item-title">分拣设备名称</div>
    <div class="panel-item-value">
      {{ data.Name }}
    </div>
  </div>
  <div class="panel-item">
    <div class="panel-item-title">分拣设备状态</div>
    <div
      class="panel-item-value"
      [style.color]="Color.style.OnlineState(data.OnlineState)"
    >
      {{ Language.OnlineStatus(data.OnlineState, "-") }}
    </div>
  </div>
  <div class="panel-item">
    <div class="panel-item-title">气泵压力值，单位：MPa</div>
    <div class="panel-item-value">
      {{ data.AirPressure ?? "-" }}
    </div>
  </div>
</div>
