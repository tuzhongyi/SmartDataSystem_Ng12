<div class="ai-garbage-station-device-command-gcha">
  <div class="command-panel form-group">
    <div class="hw-simple-title">GCHA命令</div>
    <div class="form-item">
      <div class="form-item-title">自动程序升级检测</div>
      <div class="form-item-value">
        <button
          class="hw-blue-btn"
          (click)="tocommand(AIGarbageDeviceCommand.GCHAUpgradeCheck)"
        >
          <i class="mdi mdi-upload"></i> 检测
        </button>
      </div>
    </div>
    <div class="form-item">
      <div class="form-item-title">开启TCP连接</div>
      <div class="form-item-value">
        <button
          class="hw-blue-btn"
          (click)="tocommand(AIGarbageDeviceCommand.GCHATCP)"
        >
          <i class="mdi mdi-lan"></i> 连接
        </button>
      </div>
    </div>
    <div class="form-item">
      <div class="form-item-title">重启系统</div>
      <div class="form-item-value">
        <button
          class="hw-blue-btn"
          (click)="tocommand(AIGarbageDeviceCommand.GCHAReboot)"
        >
          <i class="mdi mdi-refresh"></i> 重启
        </button>
      </div>
    </div>
  </div>

  <app-window
    [Model]="window.confirm"
    *ngIf="window.confirm.show"
    [style]="window.confirm.style"
  >
    <ai-garbage-station-device-command-confirm
      [command]="window.confirm.command"
      (ok)="oncommand($event)"
      (cancel)="window.close()"
    ></ai-garbage-station-device-command-confirm>
  </app-window>
</div>
