<div class="ai-garbage-station-device-session-list">
  <div class="ai-garbage-station-device-session-list-head">
    <div class="head">
      <div class="head-item">
        <div class="head-item-title">行政区</div>
        <div class="head-item-value">
          <common-label-select
            [single]="true"
            [autoclose]="true"
            [(showDropDown)]="selection.region.show"
            [selectedNodes]="selection.region.selecteds"
            [height]="'325px'"
          >
            <hw-ai-garbage-station-region-tree
              #tree
              [regionNode]="true"
              (selectTreeNode)="selection.region.onselect($event)"
            >
            </hw-ai-garbage-station-region-tree>
          </common-label-select>
        </div>
      </div>
      <div class="head-item">
        <div class="head-item-title">名称</div>
        <div class="head-item-value">
          <howell-simple-search
            (searchEvent)="onsearch($event)"
          ></howell-simple-search>
        </div>
      </div>
    </div>
  </div>
  <div class="ai-garbage-station-device-session-list-foot">
    <app-table-select (tableSelect)="onallselect($event)"></app-table-select>
    <app-paginator
      [length]="page.TotalRecordCount"
      [pageSize]="page.PageSize"
      [pagerCount]="3"
      [pageIndex]="page.PageIndex - 1"
      [showFirstLastButtons]="true"
      [showJumpTo]="true"
      (page)="pageEvent($event)"
    >
    </app-paginator>
  </div>
  <div class="ai-garbage-station-device-session-list-body">
    <table class="table" border="0" cellpadding="0" cellspacing="0">
      <colgroup>
        <col style="width: 40px" />
        <col style="width: auto" />
        <col style="width: auto" />
        <col style="width: 70px" />
      </colgroup>
      <tbody>
        <tr
          class="table-item"
          [ngClass]="{ selected: selecteds.includes(item) }"
          *ngFor="let item of datas"
        >
          <td>
            <div class="flex">
              <mat-checkbox
                [disableRipple]="true"
                [checked]="selecteds.includes(item)"
                (change)="oncheckclick(item)"
              ></mat-checkbox>
            </div>
          </td>
          <td
            (click)="onitemclick($event, item)"
            [title]="item.Name + '\n' + (item.GarbageStationName ?? '')"
          >
            {{ item.Name }}
          </td>
          <td (click)="onitemclick($event, item)" [title]="item.RegionName">
            {{ item.RegionName }}
          </td>
          <td (click)="onitemclick($event, item)">
            <div class="flex">
              <div
                [class]="
                  Color.OnlineState(item.Status?.GCHAStatus?.OnlineState, false)
                "
                [title]="
                  Language.OnlineStatus(item.Status?.GCHAStatus?.OnlineState)
                "
              >
                <i
                  [ngClass]="{
                    'howell-icon-signal':
                      item.Status?.GCHAStatus?.OnlineState === 0,
                    'howell-icon-no_signal': !(
                      item.Status?.GCHAStatus?.OnlineState === 0
                    )
                  }"
                ></i>
              </div>
              <div
                [class]="Color.YesOrNo(!!item.session)"
                [title]="!!item.session ? 'Session已连接' : 'Session未连接'"
              >
                <i
                  [ngClass]="{
                    'howell-icon-Link': !!item.session,
                    'howell-icon-Unlink': !item.session
                  }"
                ></i>
              </div>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

  <div class="ai-garbage-station-device-session-list-foot">
    <button
      style="width: 100%; height: 80%"
      class="hw-green-btn"
      (click)="oncommand()"
    >
